name: Axiom runtime wheel (personal fork)
on:
  push:
    branches: [axiom/release/1.6.1, axiom/release/1.6.2, axiom/release/1.7.0]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built wheel as an axiom-runtime GitHub release
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: axiom-runtime-wheel-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wheel:
    if: github.repository == 'SeungminHeo/dynamo'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    container: quay.io/pypa/manylinux_2_28_x86_64
    env:
      CARGO_BUILD_JOBS: '3'
      CUDARC_CUDA_VERSION: '13000'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      CARGO_PROFILE_RELEASE_LTO: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Install CPU build tools
        shell: bash
        run: |
          set -euo pipefail
          dnf install -y clang-devel openssl-devel zlib-devel pkgconf-pkg-config unzip
          curl --fail --location --retry 3 https://sh.rustup.rs -o /tmp/rustup.sh
          sh /tmp/rustup.sh -y --profile minimal --default-toolchain 1.96.1
          curl --fail --location --retry 3 https://github.com/protocolbuffers/protobuf/releases/download/v30.2/protoc-30.2-linux-x86_64.zip -o /tmp/protoc.zip
          unzip -q /tmp/protoc.zip -d /opt/protoc
          echo /opt/protoc/bin >> "$GITHUB_PATH"
          /opt/python/cp312-cp312/bin/python -m venv /opt/solar-build
          /opt/solar-build/bin/python -m pip install 'maturin[patchelf]==1.16.0'
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo /opt/solar-build/bin >> "$GITHUB_PATH"
          /opt/solar-build/bin/maturin --version
          "$HOME/.cargo/bin/cargo" --version
      - name: Build pinned runtime wheel for Python 3.12
        working-directory: lib/bindings/python
        shell: bash
        run: |
          set -euo pipefail
          export PATH="/opt/solar-build/bin:$HOME/.cargo/bin:/opt/protoc/bin:$PATH"
          maturin build --locked --release --interpreter /opt/python/cp312-cp312/bin/python --compatibility manylinux_2_28 --features kv-indexer,slot-tracker,select-service,mm-routing,ais-forward-pass,request-trace-s3 --out ../../../dist
      - name: Verify wheel parser registration without GPUs
        shell: bash
        run: |
          set -euo pipefail
          /opt/solar-build/bin/python -m pip install --no-deps dist/ai_dynamo_runtime-*.whl
          /opt/solar-build/bin/python - <<'PY'
          from dynamo._core import get_reasoning_parser_names, get_tool_parser_names
          assert 'solar_open2' in get_reasoning_parser_names()
          assert 'solar_open2' in get_tool_parser_names()
          print('Solar Open2 reasoning and tool parsers registered')
          assert 'ax_k3' in get_reasoning_parser_names()
          assert 'ax_k3' in get_tool_parser_names()
          print('A.X-K3 ax_k3 unified parser registered')
          PY
          /opt/solar-build/bin/python - <<'PYINFO'
          import json, os, pathlib, tomllib
          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          parser = manifest["patch"]["crates-io"]["dynamo-parsers"]
          parser_v2 = manifest["patch"]["crates-io"].get("dynamo-parsers-v2", {})
          info = {
              "dynamo_commit": os.environ["GITHUB_SHA"],
              "parser_git": parser["git"],
              "parser_commit": parser["rev"],
              "parser_v2_git": parser_v2.get("git"),
              "parser_v2_commit": parser_v2.get("rev"),
              "ax_k3_call_group_policy": "all",
              "hermes_native_requires_start_token": True,
              "guided_bare_json_preserved": True,
              "empty_tools_allowed_without_forced_choice": True,
              "strict_schema_migration_env": "DYN_DISABLE_OPENAI_STRICT_SCHEMA_VALIDATION",
              "strict_schema_validation_default": "enabled",
              "run_url": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          pathlib.Path("dist/build-info.json").write_text(json.dumps(info, indent=2) + "\n")
          PYINFO
          sha256sum dist/*.whl > dist/SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: axiom-runtime-linux-x86_64-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
  publish:
    # Release-branch pushes publish automatically; a manual run publishes only when asked.
    needs: wheel
    if: github.repository == 'SeungminHeo/dynamo' && (github.event_name == 'push' || inputs.publish)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: axiom-runtime-linux-x86_64-${{ github.sha }}
          path: dist
      - name: Publish axiom-runtime release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          cd dist
          wheel=$(ls ai_dynamo_runtime-*.whl)
          version=$(unzip -p "$wheel" '*.dist-info/METADATA' | sed -n 's/^Version: //p')
          short="${SOURCE_SHA:0:12}"
          tag="axiom-runtime-${version}-${short}"
          # Published tags and wheel hashes are immutable: never replace an existing release.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; leaving it unchanged"
            exit 0
          fi
          grep -q "\"dynamo_commit\": \"${SOURCE_SHA}\"" build-info.json
          hash=$(sha256sum "$wheel" | cut -d' ' -f1)
          echo "ai-dynamo-runtime @ https://github.com/${GH_REPO}/releases/download/${tag}/${wheel} --hash=sha256:${hash}" > axiom-runtime.requirements.txt
          sha256sum "$wheel" build-info.json axiom-runtime.requirements.txt > SHA256SUMS
          subject=$(gh api "repos/${GH_REPO}/commits/${SOURCE_SHA}" --jq '.commit.message' | head -n1)
          cat > notes.md <<EOF
          Axiom downstream runtime for Dynamo ${version}, built from \`${SOURCE_REF}\`. Source: \`${SOURCE_SHA}\`.

          Head commit: ${subject}

          Carries the Axiom patch stack on that branch (Solar Open2, A.X-K3 \`ax_k3\`, the Hermes marker policy, frontend repetition stop, and the rest); see SOLAR_OPEN2.md, AX_K3.md, HERMES-MARKER-BUILD.md, and REPETITION_DETECTION.md on the source commit. Linux x86_64, built with Python 3.12; the abi3 wheel is compatible with Python 3.12.

          Install this exact wheel after ai-dynamo==${version}, preserving the engine packages. Verify SHA256SUMS first. Package version alone does not identify this custom build.

          Build and CPU import/registration check: ${RUN_URL}. GPU validation is not included.
          EOF
          # Never move "Latest": it marks the production line and is changed by hand.
          gh release create "$tag" --target "$SOURCE_SHA" --latest=false \
            --title "axiom-runtime ${version}: ${subject} (${short})" \
            --notes-file notes.md \
            "$wheel" build-info.json axiom-runtime.requirements.txt SHA256SUMS
